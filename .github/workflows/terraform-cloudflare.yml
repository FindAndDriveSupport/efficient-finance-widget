name: Cloudflare Infra

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Debug token length
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_WAF_API_TOKEN }}
        run: |
          printf %s "$TF_VAR_cloudflare_api_token" | wc -c

      - run: terraform init

      - name: Get existing ruleset IDs
        run: |
          echo "Custom firewall ruleset:"
          curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/rulesets/phases/http_request_firewall_custom/entrypoint" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_WAF_API_TOKEN }}"
          echo ""
          echo "Managed firewall ruleset:"
          curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/rulesets/phases/http_request_firewall_managed/entrypoint" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_WAF_API_TOKEN }}"

      - run: terraform plan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_WAF_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      - run: terraform apply -auto-approve
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_WAF_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}